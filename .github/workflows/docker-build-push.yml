name: Build and Push Docker Image

on:
  push:
    branches:
      - master
  # Disparador a mano. GitHub a veces no lanza el build al mergear —pasó con el
  # PR #19: master quedó actualizado y el commit se quedó con cero check-runs—,
  # y sin esto la única salida era un commit vacío para forzarlo.
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: |
          docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/proaholding-credion/platform:latest .

      - name: Push Docker image
        run: |
          docker push ghcr.io/proaholding-credion/platform:latest